api:
  base_url: "https://api.quran.com/api/v4"
  translation_id: 20
  transliteration_id: 57
  text_edition: "quran-uthmani"
  riwaya: "hafs"

reciter:
  name_ar: "وهراني مصطفى إسماعيل"

bismillah: true

matching:
  repeat_window: 4
  repeat_mode: "last"
  min_match_score: 0.75
  low_conf_score: 0.85

alignment:
  silence_snap_max_s: 0.30
  silence_threshold_db: -40
  trim_last_word_silence: true
  min_word_conf: 0.30
  max_ayah_seconds_factor: 3.0

models:
  recognizer: "naazimsnh02/whisper-large-v3-turbo-ar-quran"
  aligner: "MahmoudAshraf/mms-300m-1130-forced-aligner"
  device: "auto"

display:
  header_title: "arabic_only"
  reciter_font: "template/fonts/ArefRuqaa-Regular.ttf"
  arabic_font: "template/fonts/NotoNaskhArabic-Regular.ttf"
  translit_font: "template/fonts/DejaVuSans.ttf"
  english_font: "template/fonts/DejaVuSans.ttf"
  boxes:
    arabic: [190, 380, 1290, 120]
    translit: [40, 520, 1590, 102]
    english: [60, 636, 1550, 109]
    reciter: [265, 35, 470, 90]
    title: [700, 35, 500, 70]
  group_min_font_size: 42
  min_font_size: 28
  max_font_size: 72
  max_lines: 3
  max_ayahs_per_screen: 2
  lead_time_s: 0.1

paths:
  background: "template/background.png"
  template_ass: "template/template.ass"
  work_dir: "work"
  output_dir: "output"
  log_dir: "logs"